# Catálogo B2B: testa cada alteração, verifica as chaves e, no ramo main, publica tudo automaticamente.
# Só são precisos 3 segredos no GitHub: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD e CLOUDFLARE_API_TOKEN.
# O resto (projeto, endereço, chaves públicas, conta Cloudflare) é descoberto por scripts/resolve-config.sh.
name: Catálogo B2B

on:
  pull_request:
    paths: ["catalogo-b2b/**", ".github/workflows/catalogo-b2b.yml"]
  push:
    branches: [main]
    paths: ["catalogo-b2b/**", ".github/workflows/catalogo-b2b.yml"]
  workflow_dispatch:

concurrency:
  group: catalogo-b2b-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: catalogo-b2b

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # ID da conta Cloudflare da Representações Freixo (não é secreto; um segredo com o mesmo nome tem prioridade).
  CLOUDFLARE_ACCOUNT_ID_DEFAULT: 28b6ca9edbc3e5a4864f111ae12f2130

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: catalogo-b2b/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Confirma que as chaves estão certas, sem publicar nada. O resultado aparece no resumo da execução.
  verificar-chaves:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Verificar chaves
        run: ./scripts/resolve-config.sh

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: catalogo-b2b/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Descobrir e verificar configuração
        run: ./scripts/resolve-config.sh

      # 0) Domínio próprio: b2b.representacoesfreixo.com (novo) e encomendas.representacoesfreixo.com (antigo, continua a funcionar).
      #    A loja usa o primeiro que estiver ativo no Cloudflare; sem nenhum ativo, fica em freixo-b2b.pages.dev.
      - name: Ligar os domínios próprios
        env:
          APP_URL_VAR: ${{ vars.APP_URL }}
          DOMAINS: b2b.representacoesfreixo.com encomendas.representacoesfreixo.com
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/freixo-b2b/domains"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          url=""
          for domain in $DOMAINS; do
            curl -s -X POST "$api" "${auth[@]}" -H "Content-Type: application/json" -d "{\"name\":\"$domain\"}" > /dev/null || true
            status=unknown
            for i in $(seq 1 12); do
              status=$(curl -s "$api/$domain" "${auth[@]}" | jq -r '.result.status // "unknown"')
              [ "$status" = active ] && break
              [ "$i" = 1 ] && curl -s -X PATCH "$api/$domain" "${auth[@]}" > /dev/null || true
              sleep 10
            done
            echo "Estado do domínio $domain: $status" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -z "$url" ] && [ "$status" = active ]; then url="https://$domain"; fi
          done
          [ -n "$APP_URL_VAR" ] && url="$APP_URL_VAR"
          [ -z "$url" ] && url="https://freixo-b2b.pages.dev"
          echo "APP_URL=$url" >> "$GITHUB_ENV"
          echo "Endereço da loja: $url" | tee -a "$GITHUB_STEP_SUMMARY"

      # 1) Base de dados e funções (Supabase)
      - name: Atualizar base de dados
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Publicar funções de email e convites
        run: |
          supabase functions deploy notify-order --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy invite-client --project-ref "$SUPABASE_PROJECT_REF"
      - name: Configurar funções
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
        run: |
          args=(B2B_SERVICE_KEY="$B2B_SERVICE_KEY" APP_URL="$APP_URL")
          if [ -n "$MS_CLIENT_SECRET" ]; then
            args+=(MS_TENANT_ID="$MS_TENANT_ID" MS_CLIENT_ID="$MS_CLIENT_ID" MS_CLIENT_SECRET="$MS_CLIENT_SECRET"
                   MAIL_FROM="$MAIL_FROM" NOTIFY_TO="$NOTIFY_TO")
          fi
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}" > /dev/null

      - name: Configurar logins e convidar a gestão
        env:
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || 'afreixo@representacoesfreixo.com' }}
        run: ./scripts/setup-auth.sh

      # 2) Site (Cloudflare Pages)
      - run: npm ci
      - name: Construir o site
        run: npm run build
      - name: Publicar no Cloudflare Pages
        run: |
          npx --yes wrangler@4 pages project create freixo-b2b --production-branch main || true
          npx --yes wrangler@4 pages deploy dist --project-name freixo-b2b --branch main --commit-dirty=true
