# Catálogo B2B: testa cada alteração e, no ramo main, publica tudo automaticamente.
# A publicação só corre depois de os segredos estarem configurados no GitHub
# (Settings → Secrets and variables → Actions). Ver catalogo-b2b/README.md.
name: Catálogo B2B

on:
  pull_request:
    paths: ["catalogo-b2b/**", ".github/workflows/catalogo-b2b.yml"]
  push:
    branches: [main]
    paths: ["catalogo-b2b/**", ".github/workflows/catalogo-b2b.yml"]
  workflow_dispatch:

concurrency:
  group: catalogo-b2b-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: catalogo-b2b

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: catalogo-b2b/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: catalogo-b2b/package-lock.json

      # 1) Base de dados e funções (Supabase)
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: 2.122.0
      - name: Atualizar base de dados
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Publicar funções de email e convites
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase functions deploy notify-order --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy invite-client --project-ref "$SUPABASE_PROJECT_REF"
      - name: Configurar email (Microsoft 365)
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.MS_CLIENT_SECRET != ''
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            MS_TENANT_ID="$MS_TENANT_ID" MS_CLIENT_ID="$MS_CLIENT_ID" MS_CLIENT_SECRET="$MS_CLIENT_SECRET" \
            MAIL_FROM="$MAIL_FROM" NOTIFY_TO="$NOTIFY_TO" APP_URL="$APP_URL"

      # 2) Site (Cloudflare Pages)
      - run: npm ci
      - name: Construir o site
        # Sem as chaves do Supabase o site sairia em modo demonstração: nesse caso não publica.
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Falta o segredo VITE_SUPABASE_URL: não publico um site em modo demonstração."; exit 1
          fi
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Publicar no Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@4 pages project create freixo-b2b --production-branch main || true
          npx --yes wrangler@4 pages deploy dist --project-name freixo-b2b --branch main --commit-dirty=true
